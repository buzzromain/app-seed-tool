---
name: Fork integration CI

# Fork-only tooling: runs the same reusable build/test jobs as
# ci-workflow.yml, but on the fork's aggregation branches instead of
# master/develop. This CI does not replace the checks required on PRs
# to Aido; it exists to test the aggregation before submission.
on:
  push:
    branches:
      - integration/develop
      - integration/bip85

jobs:
  ledger_app_build:
    name: Build application using the reusable workflow
    uses: LedgerHQ/ledger-app-workflows/.github/workflows/reusable_build.yml@v1
    with:
      upload_app_binaries_artifact: compiled_app_binaries
      run_for_devices: '["nanox", "nanosp", "stax", "flex", "apex_p"]'

  ledger_app_test_function:
    name: Run ragger tests using the reusable workflow
    needs: ledger_app_build
    uses: LedgerHQ/ledger-app-workflows/.github/workflows/reusable_ragger_tests.yml@v1
    with:
      download_app_binaries_artifact: compiled_app_binaries
      test_dir: tests/functional
      post_stack_consumption: false
      run_for_devices: '["stax", "flex", "apex_p"]'
